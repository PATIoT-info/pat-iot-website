# Posts one blog post to one social platform through Buffer. The admin panel's buttons start this.
# Run it by hand with "Dry run" ticked to check the setup without publishing anything.
name: Share blog post
run-name: ${{ inputs.dry_run && 'Check' || 'Share' }} ${{ inputs.slug }} to ${{ inputs.platform }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Post slug (blank with dry run = newest post)
        required: false
      platform:
        description: Platform
        type: choice
        options: [all, linkedin, facebook, instagram]
        default: all
      dry_run:
        description: Dry run (check the setup, publish nothing)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/share-blog.js
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SLUG: ${{ inputs.slug }}
          PLATFORM: ${{ inputs.platform }}
          DRY_RUN: ${{ inputs.dry_run }}
      # Runs after a failure too: a post that did go out must stay recorded, or a retry would duplicate it
      - name: Record what was posted
        if: always()
        env:
          SLUG: ${{ inputs.slug }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          git status --porcelain data/social-posts.json | grep -q . || exit 0
          cp data/social-posts.json "$RUNNER_TEMP/posted.json"
          git config user.name "PAT IOT SOLUTIONS"
          git config user.email "info@patiot.in"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node .github/scripts/record-social-post.js "$RUNNER_TEMP/posted.json"
            git add data/social-posts.json
            git commit -m "Record social post: $SLUG to $PLATFORM"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
